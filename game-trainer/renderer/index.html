<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:">
  <title>Game Trainer</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <svg class="brand-logo" viewBox="0 0 32 32" aria-hidden="true">
          <rect x="2" y="8" width="28" height="16" rx="8" />
          <circle cx="10" cy="16" r="3" class="brand-dot" />
          <path d="M20 13v6M17 16h6" class="brand-plus" />
        </svg>
        <span>Game Trainer</span>
      </div>

      <div class="sidebar-label">Bibliothek</div>
      <nav id="game-list" class="game-list" aria-label="Spiele"></nav>

      <div class="sidebar-foot">
        <div id="bridge-info" class="bridge-info"></div>
      </div>
    </aside>

    <main id="main" class="main">
      <div class="empty">Lade Spiele …</div>
    </main>
  </div>

  <div id="toasts" class="toasts" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
