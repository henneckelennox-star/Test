<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dossier Weltfrieden</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Source+Sans+3:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: Lagezentrum – dunkles Kopfband mit Sicherheitsrats-Hufeisen, darunter Akten (Dossiers) als Liste; Quiz als eine konzentrierte Karte. */
:root{
  --bg:#eef2f6; --panel:#ffffff; --panel2:#f5f8fb; --ink:#13202e; --muted:#566475; --line:#d5dde6;
  --band:#0f1d2c; --band-ink:#e8eef5; --band-muted:#8fa3b8;
  --acc:#1f6fc5; --acc-ink:#ffffff; --acc-soft:#e1edf9;
  --gold:#b07a00; --gold-soft:#fbf0d4;
  --ok:#1d7f48; --ok-soft:#dcf1e4; --bad:#c2372b; --bad-soft:#fbe3e0;
  --display:"Archivo","Arial Narrow",Arial,sans-serif; --body:"Source Sans 3","Segoe UI",Arial,sans-serif; --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0d151e; --panel:#152130; --panel2:#1a2838; --ink:#e4ebf2; --muted:#93a4b6; --line:#263649;
  --band:#08101a; --band-ink:#e8eef5; --band-muted:#7f93a8;
  --acc:#5aa2ef; --acc-ink:#07121e; --acc-soft:#16304b;
  --gold:#e6b43c; --gold-soft:#3a2e12;
  --ok:#4cc27d; --ok-soft:#14301f; --bad:#ff7366; --bad-soft:#3b1a17; color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#0d151e; --panel:#152130; --panel2:#1a2838; --ink:#e4ebf2; --muted:#93a4b6; --line:#263649;
  --band:#08101a; --band-ink:#e8eef5; --band-muted:#7f93a8;
  --acc:#5aa2ef; --acc-ink:#07121e; --acc-soft:#16304b;
  --gold:#e6b43c; --gold-soft:#3a2e12;
  --ok:#4cc27d; --ok-soft:#14301f; --bad:#ff7366; --bad-soft:#3b1a17; color-scheme:dark; }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.wrap{max-width:860px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.mono{font-family:var(--mono);font-size:.78rem;letter-spacing:.04em}

/* Kopfband */
.hero{background:var(--band);color:var(--band-ink);margin-top:calc(-1 * env(safe-area-inset-top,0px));padding-top:calc(env(safe-area-inset-top,0px) + 1.6rem);padding-bottom:1.6rem}
.hero .wrap{display:grid;grid-template-columns:1fr auto;gap:1.2rem;align-items:center}
.hero .eyebrow{color:var(--band-muted);text-transform:uppercase}
.hero h1{font-family:var(--display);font-variation-settings:"wdth" 70;font-weight:850;font-size:clamp(2.4rem,8vw,3.8rem);line-height:.95;margin:.3rem 0 .6rem;letter-spacing:-.01em;text-wrap:balance}
.hero p{margin:0;color:var(--band-muted);max-width:46ch}
.horseshoe{width:150px;max-width:100%}
.rankline{display:flex;flex-wrap:wrap;gap:.6rem 1.4rem;margin-top:1rem;align-items:baseline}
.rank{font-family:var(--display);font-variation-settings:"wdth" 90;font-weight:700;font-size:1.25rem}
.rankline .mono{color:var(--band-muted)}
.bar{height:6px;background:rgba(255,255,255,.12);border-radius:3px;overflow:hidden;margin-top:.5rem;max-width:340px}
.bar i{display:block;height:100%;background:var(--gold)}
@media (max-width:560px){.hero .wrap{grid-template-columns:1fr}.horseshoe{display:none}}

/* Startseite */
main{padding-block:1.4rem 3rem}
.tools{display:flex;flex-wrap:wrap;gap:.6rem;margin-bottom:1.2rem;align-items:center}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:.45rem .9rem;font-weight:600;font-size:.95rem}
.chip[aria-pressed="true"]{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.chip:disabled{opacity:.45;cursor:not-allowed}
.hint{color:var(--muted);font-size:.92rem;margin:0 0 1rem}
.files{display:grid;gap:0;border-top:2px solid var(--ink)}
.file{display:grid;grid-template-columns:4.2rem 1fr auto;gap:.2rem 1rem;align-items:center;padding:.9rem .2rem;border-bottom:1px solid var(--line);background:none;border-left:0;border-right:0;border-top:0;text-align:left;width:100%}
.file:hover:not(:disabled){background:var(--panel2)}
.file:disabled{opacity:.5;cursor:not-allowed}
.file .code{font-family:var(--mono);font-size:.8rem;color:var(--muted)}
.file h3{margin:0;font-family:var(--display);font-variation-settings:"wdth" 85;font-weight:750;font-size:1.22rem;line-height:1.15}
.file .sub{grid-column:2;color:var(--muted);font-size:.9rem;min-width:0}
.file .meta{grid-row:1 / span 2;grid-column:3;text-align:right}
.stars{color:var(--gold);letter-spacing:.1em;font-size:1.05rem;white-space:nowrap}
.stars .off{color:var(--line)}
.best{display:block;font-family:var(--mono);font-size:.72rem;color:var(--muted)}
.file.final h3::after{content:" · Prüfung";color:var(--acc)}

/* Quiz */
.qtop{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--band);color:var(--band-ink)}
body.inquiz::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--band)}
.qtop .wrap{display:flex;align-items:center;gap:.7rem;padding-block:.65rem}
.qtop .back{background:none;border:1px solid rgba(255,255,255,.25);color:var(--band-ink);border-radius:6px;padding:.25rem .6rem;font-size:.9rem}
.qtop .title{font-family:var(--display);font-variation-settings:"wdth" 80;font-weight:700;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hearts{letter-spacing:.15em;font-size:1rem;color:var(--band-ink)}
.hearts .lost{opacity:.25}
.score{font-family:var(--mono);font-weight:600;font-variant-numeric:tabular-nums}
.streak{font-family:var(--mono);font-size:.78rem;color:var(--gold);white-space:nowrap}
.streak:empty{display:none}
.hearts{white-space:nowrap}
.prog{height:4px;background:rgba(255,255,255,.12)}
.prog i{display:block;height:100%;background:var(--acc);transition:width .3s}
.timer{height:3px;background:transparent}
.timer i{display:block;height:100%;background:var(--gold);width:100%}

.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:1.3rem;margin-top:1.2rem}
.qkind{display:flex;justify-content:space-between;gap:1rem;color:var(--muted);text-transform:uppercase;margin-bottom:.5rem}
.qtext{font-family:var(--display);font-variation-settings:"wdth" 92;font-weight:650;font-size:clamp(1.18rem,3.6vw,1.45rem);line-height:1.25;margin:0 0 1.1rem;text-wrap:balance}
.qtext small{display:block;font-family:var(--body);font-weight:400;font-size:.95rem;color:var(--muted);margin-top:.4rem}
.opts{display:grid;gap:.55rem}
.opt{display:flex;gap:.75rem;align-items:flex-start;text-align:left;background:var(--panel2);border:1.5px solid var(--line);border-radius:8px;padding:.7rem .85rem;width:100%;line-height:1.35}
.opt:hover:not(:disabled){border-color:var(--acc)}
.opt .k{font-family:var(--mono);font-size:.75rem;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:.05rem .35rem;flex:none;margin-top:.12rem}
.opt[aria-pressed="true"]{border-color:var(--acc);background:var(--acc-soft)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.missed{border-style:dashed;border-color:var(--ok)}
.opt:disabled{cursor:default}
.tf{display:grid;grid-template-columns:1fr 1fr;gap:.6rem}
.tf .opt{justify-content:center;font-weight:700}

.sortrow{display:grid;grid-template-columns:minmax(0,1fr);gap:.4rem;padding:.6rem 0;border-bottom:1px solid var(--line)}
.sortrow:last-child{border-bottom:0}
.sortrow .item{font-weight:600;line-height:1.3}
.seg{display:flex;flex-wrap:wrap;gap:.35rem}
.seg button{border:1.5px solid var(--line);background:var(--panel2);border-radius:6px;padding:.3rem .6rem;font-size:.88rem}
.seg button[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.seg button.right{background:var(--ok);border-color:var(--ok);color:#fff}
.seg button.wrong{background:var(--bad);border-color:var(--bad);color:#fff}
.seg button.missed{border-color:var(--ok);border-style:dashed}

.seq{display:grid;gap:.4rem;margin-bottom:1rem;counter-reset:s}
.seq .slot{border:1.5px dashed var(--line);border-radius:8px;padding:.55rem .8rem;color:var(--muted);min-height:2.6rem;display:flex;gap:.6rem;align-items:center}
.seq .slot.filled{border-style:solid;color:var(--ink);background:var(--acc-soft);border-color:var(--acc)}
.seq .slot.right{background:var(--ok-soft);border-color:var(--ok)}
.seq .slot.wrong{background:var(--bad-soft);border-color:var(--bad)}
.seq .n{font-family:var(--mono);font-size:.75rem;color:var(--muted);flex:none;width:1.4rem}
.pool{display:flex;flex-wrap:wrap;gap:.45rem}
.pool button{border:1.5px solid var(--line);background:var(--panel2);border-radius:8px;padding:.45rem .7rem;text-align:left;line-height:1.3}
.pool button:hover{border-color:var(--acc)}

.inp{display:flex;gap:.5rem;flex-wrap:wrap}
.inp input{flex:1;min-width:0;font:inherit;padding:.65rem .8rem;border:1.5px solid var(--line);border-radius:8px;background:var(--panel2);color:var(--ink)}
.inp input.right{border-color:var(--ok);background:var(--ok-soft)}
.inp input.wrong{border-color:var(--bad);background:var(--bad-soft)}

.council{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:.35rem;margin:0 0 1rem}
.seat{border:1px solid var(--line);border-radius:6px;padding:.35rem .2rem;text-align:center;font-size:.78rem;line-height:1.2;background:var(--panel2)}
.seat b{display:block;font-family:var(--mono);font-size:.7rem;font-weight:600;color:var(--muted)}
.seat.p5{border-width:2px;border-color:var(--ink)}
.seat.ja{background:var(--ok-soft)}
.seat.nein{background:var(--bad-soft)}
.seat.enth{background:var(--panel)}
.tally{font-family:var(--mono);font-size:.82rem;color:var(--muted);margin:-.4rem 0 1rem}

.actions{display:flex;gap:.6rem;margin-top:1.1rem;flex-wrap:wrap}
.btn{background:var(--acc);color:var(--acc-ink);border:0;border-radius:8px;padding:.7rem 1.2rem;font-weight:700}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.fb{margin-top:1.1rem;border-radius:8px;padding:.9rem 1rem;border-left:5px solid var(--ok);background:var(--ok-soft)}
.fb.bad{border-left-color:var(--bad);background:var(--bad-soft)}
.fb h4{margin:0 0 .3rem;font-family:var(--display);font-variation-settings:"wdth" 90;font-size:1.05rem}
.fb p{margin:0;max-width:65ch}
.fb .pts{font-family:var(--mono);font-size:.8rem;float:right}
.fb .sol{margin-top:.4rem;font-weight:600}

/* Ergebnis */
.result h2{font-family:var(--display);font-variation-settings:"wdth" 75;font-weight:850;font-size:clamp(2rem,7vw,3rem);margin:.2rem 0 .4rem;line-height:1}
.result .bigstars{font-size:2.2rem;color:var(--gold);letter-spacing:.15em}
.result .bigstars .off{color:var(--line)}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.8rem;margin:1rem 0}
.kpi{border-top:2px solid var(--ink);padding-top:.4rem}
.kpi b{display:block;font-family:var(--display);font-variation-settings:"wdth" 80;font-size:1.7rem;font-variant-numeric:tabular-nums}
.kpi span{color:var(--muted);font-size:.85rem}
.review{margin-top:1rem}
.review li{margin-bottom:.6rem}
.review .q{font-weight:600}
.review .a{color:var(--muted);font-size:.92rem}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
</style>
</head>
<body>

<div id="app"></div>

<script>
/* ================================================================
   FRAGENPOOL – alle Inhalte stammen aus den Unterrichtsmaterialien
   Typen: mc (o[0] ist richtig), multi (r richtig, w falsch), tf,
   sort (cats), order (items in richtiger Reihenfolge), input (a)
   ================================================================ */
const D = [
{key:'T',code:'Q3/01',title:'Terrorismus',sub:'Münkler M 1.1 · Formen M 1.2 · Motive, Zielgruppe, Ziel',q:[
 {t:'mc',q:'Warum ist eine allgemein anerkannte Definition von Terrorismus laut Münkler so umstritten?',o:['Es gibt sachliche und machtpolitische Gründe: Wer Gewalt „terroristisch“ nennt, spricht ihr in der Regel jede politische Legitimität ab.','Weil Terrorismus erst seit 2001 existiert und noch kaum erforscht ist.','Weil die UN-Charta Terrorismus ausdrücklich als Form der Selbstverteidigung erlaubt.','Weil Terrorismus und Amok in der Forschung als dasselbe gelten.'],e:'Die Bezeichnung ist ein politisches Werkzeug. Wer Gewalthandlungen „terroristisch“ nennt, will ihnen die Legitimität absprechen – deshalb streiten Akteure über das Etikett.'},
 {t:'mc',q:'Münkler nennt „Terrorismus“ in der internationalen Politik einen …',o:['Ausschließungsbegriff','Kampfbegriff der Guerilla','Fachbegriff der UN-Charta','Sammelbegriff für alle Kriege'],e:'Ausschließungsbegriff: Den so bezeichneten Akteuren wird bedeutet, dass ihre Anliegen nicht verhandelbar sind – solange sie sich bestimmter Formen der Gewalt bedienen.'},
 {t:'mc',q:'Wie bezeichnen sich die als terroristisch bezeichneten Gruppen laut M 1.1 häufig selbst?',o:['Als Guerilleros, die einen Partisanenkampf für die Befreiung sozialer oder ethnischer Gruppen führen','Als reguläre Streitkräfte eines souveränen Staates','Als neutrale Friedenstruppe','Als private Sicherheitsfirmen'],e:'Sie reklamieren für sich, Guerilleros (Widerstandskämpfer) zu sein und einen Partisanenkampf (außerhalb einer regulären Armee) zu führen.'},
 {t:'mc',q:'Mit welcher Begründung rechtfertigen solche Gruppen laut M 1.1 ihre „unkonventionellen“ Methoden?',o:['Wegen der militärischen Überlegenheit der Repressionsmacht','Weil das Völkerrecht ihnen diese Methoden ausdrücklich erlaubt','Weil der UN-Sicherheitsrat sie dazu ermächtigt hat','Weil sie über mehr Waffen verfügen als der Staat'],e:'Aus Sicht der Gruppen muss „aufgrund der militärischen Überlegenheit der Repressionsmacht“ auf unkonventionelle Methoden zurückgegriffen werden.'},
 {t:'mc',q:'Terrorismus ist nach Münkler eine Form der Gewaltanwendung, die Erfolge wesentlich erringen will über …',o:['die indirekten Effekte der Gewalt','die Zahl der Toten','die Eroberung von Territorium','die Zerstörung von Versorgungssystemen'],e:'Terrorismus will „wesentlich über die indirekten Effekte der Gewalt Erfolge erringen“.'},
 {t:'mc',q:'Woran sind terroristische Strategien laut Münkler WENIGER interessiert?',o:['An den materiellen Schäden: Ausmaß der Zerstörung, Zahl der Toten, Zusammenbruch der Versorgung','Am Schrecken, der verbreitet wird','An Erwartungen und Hoffnungen bei Sympathisanten','An der Botschaft, der Gegner sei verletzbar'],e:'Gerade die physischen/materiellen Folgen sind zweitrangig. Wichtig sind die psychischen Folgen: Schrecken sowie Erwartungen und Hoffnungen als Zeichen der Verletzbarkeit eines scheinbar übermächtigen Gegners.'},
 {t:'multi',q:'Welche Folgen eines Anschlags zählen bei Münkler zu den PSYCHISCHEN Folgen?',r:['Der Schrecken, der verbreitet wird','Hoffnungen der Unterstützer, weil der Gegner verletzbar wirkt','Das Zeichen der Verletzbarkeit eines scheinbar übermächtigen Gegners'],w:['Die Anzahl der Toten','Der Zusammenbruch der Versorgungssysteme','Das Ausmaß der Zerstörungen'],e:'Psychisch: Schrecken, Erwartungen und Hoffnungen. Physisch/materiell: Tote, Zerstörungen, zusammengebrochene Versorgung.'},
 {t:'sort',q:'Ordne die Merkmale der passenden Form des Terrorismus (M 1.2) zu.',cats:{'Ethno-nationalistisch':['Militante Organisationen von Minderheitspopulationen','Eigene Tradition und Sprache','Anspruch auf ein bestimmtes Gebiet','Identitätsbewusstsein, das sich von der Mehrheit des Nationalstaats abhebt'],'Religiös':['Gespeist durch fundamentalistische Strömungen','Radikale protestantische Sekten','Islamische Splittergruppen in Algerien und im Libanon']},e:'Ethno-nationalistisch: Minderheit + eigene Identität + Gebietsanspruch. Religiös: fundamentalistische Strömungen, z. B. radikale protestantische Sekten oder islamische Splittergruppen.'},
 {t:'mc',q:'Eine Untergrundgruppe einer sprachlichen Minderheit verübt Anschläge, um einen eigenen Staat in ihrer Heimatregion zu erzwingen. Welche Form nach M 1.2?',o:['Ethno-nationalistischer Terrorismus','Religiöser Terrorismus','Hybride Kriegführung','Klassischer zwischenstaatlicher Krieg'],e:'Minderheit mit eigener Sprache/Identität + Anspruch auf ein Gebiet = ethno-nationalistisch.'},
 {t:'multi',q:'Welche Motive für Terrorismus stehen in deinem Tafelbild?',r:['religiös','politisch','egoistisch'],w:['präventiv','geostrategisch','humanitär'],e:'Tafelbild Terrorismus: Motive religiös, politisch, egoistisch. „Präventiv“ und „geostrategisch“ sind Motive für KRIEG (Tafelbild Krieg) – eine typische Verwechslung.'},
 {t:'tf',q:'Terrorismus und Amok sind im Kern dasselbe, weil beide Angst verbreiten.',a:false,e:'Im Tafelbild steht ausdrücklich „Terrorismus ≠ Amok“. Terror ist eine Kommunikationsstrategie mit dem Ziel, etwas zu verändern; die Tat soll eine Botschaft an die Gesamtgesellschaft senden.'},
 {t:'mc',q:'Wer ist laut Tafelbild die eigentliche Zielgruppe von Terror?',o:['Die Gesamtgesellschaft – direkt getroffen werden häufig Unbeteiligte','Ausschließlich Soldaten','Nur Regierungsmitglieder','Die eigenen Anhänger'],e:'Direkt trifft es häufig Unbeteiligte, gemeint ist aber die Gesamtgesellschaft – deshalb „Kommunikationsstrategie“.'},
 {t:'input',q:'Ergänze: Terrorismus ist eine Kommunikations________.',a:['strategie','kommunikationsstrategie'],e:'Kommunikationsstrategie (Überschrift von M 1.1): Gewalt soll Angst und Schrecken verbreiten und eine Botschaft senden.'},
 {t:'tf',q:'Laut M 1.2 kennt die Terrorismusforschung genau zwei Formen von Terrorismus.',a:false,e:'Es heißt: „neben anderen vor allem zwei Formen“. Es gibt also weitere Formen.'},
 {t:'mc',q:'Aufgabe 2 (M 1.1): Welche Beobachtung zu 9/11 stützt Münklers These vom Vorrang der psychischen Folgen am stärksten?',o:['Die weltweite Verunsicherung und die Reaktionen – bis zum einzigen NATO-Bündnisfall der Geschichte – reichten weit über die materiellen Schäden hinaus.','Die USA verloren durch die Anschläge dauerhaft ihre Versorgungssysteme.','Die Täter wollten New York militärisch besetzen.','Die Zahl der Opfer war größer als in jedem Krieg zuvor.'],e:'Die Wirkung (Angst, Sicherheitspolitik weltweit, Art. 5 NATO) übersteigt den physischen Schaden bei Weitem – genau das meint Münkler.'},
 {t:'mc',q:'Warum gilt Terror im Tafelbild oft als „letztes Mittel“?',o:['Täter wollen etwas verändern, was ihnen mehr wert ist als das eigene Leben','Weil Terror völkerrechtlich erst nach einem UN-Beschluss erlaubt ist','Weil Staaten Terror als letzte Stufe von Sanktionen einsetzen','Weil er immer am Ende eines Krieges steht'],e:'Tafelbild: Kommunikationsstrategie → oft als letztes Mittel → mit dem Ziel, etwas zu verändern → was mehr wert ist als das eigene Leben.'},
]},
{key:'K',code:'Q3/02',title:'Krieg & Frieden',sub:'AKUF-Kriterien · Neue Kriege · hybride Kriegführung · Zivilisatorisches Hexagon',q:[
 {t:'mc',q:'Wie lautet die klassische Definition von Krieg im Text?',o:['Ein bewaffneter, organisierter Konflikt zwischen politisch konsolidierten Akteuren, mit gewisser Intensität und Kontinuität','Jede Gewalttat mit mehr als 1.000 Toten','Ein Konflikt, den der UN-Sicherheitsrat als Krieg feststellt','Jeder Konflikt, der mit einer Kriegserklärung beginnt'],e:'Klassische Definition: bewaffnet, organisiert, politisch konsolidierte Akteure, gewisse Intensität und Kontinuität.'},
 {t:'multi',q:'Welche Kriterien muss ein Gewaltereignis nach der AKUF erfüllen, um als Krieg zu gelten?',r:['Beteiligung von Streitkräften (mind. eine Seite reguläre Streitkräfte)','Mindestmaß an zentral gelenkter Organisation auf beiden Seiten','Kontinuität der Operationen'],w:['Eine förmliche Kriegserklärung','Mindestens zwei souveräne Staaten als Kriegsparteien','Ein Beschluss des UN-Sicherheitsrats'],e:'AKUF: (1) Streitkräfte (auch bewaffnete Oppositionseinheiten zählen), (2) Organisation auf beiden Seiten, (3) Kontinuität statt spontaner Zusammenstöße.'},
 {t:'tf',q:'Nach der AKUF-Definition müssen auf BEIDEN Seiten reguläre Streitkräfte kämpfen.',a:false,e:'Mindestens auf EINER Seite müssen reguläre Streitkräfte (Regierung oder bewaffnete Oppositionseinheiten) beteiligt sein. Organisation braucht es dagegen auf beiden Seiten.'},
 {t:'input',q:'Seit welchem Jahr (Westfälisches Staatensystem) gilt Krieg als Monopol souveräner Staaten?',a:['1648'],e:'Westfälischer Frieden 1648: Krieg wird Monopol souveräner Staaten.'},
 {t:'sort',q:'Klassischer Krieg oder „Neuer Krieg“? Ordne zu.',cats:{'Klassischer Krieg':['Deklarierter Beginn durch Kriegserklärung','Physische Frontlinie zwischen Kombattanten','Formales Ende durch Waffenstillstand oder Friedensvertrag','Militärischer Zustand zwischen souveränen Staaten'],'Neue Kriege':['Warlords, Milizen und private Sicherheitsfirmen','Finanzierung über Konfliktdiamanten, Drogen, Erpressung','Grenze zwischen Zivilisten und Kombattanten verwischt','Krieg wird zum Dauerzustand']},e:'Klassisch = Binarität (Beginn, Front, Ende) zwischen Staaten. Neue Kriege = Entstaatlichung/Asymmetrie, Schattenökonomien, Autonomisierung der Gewalt.'},
 {t:'mc',q:'Was meint „Autonomisierung der Gewalt“?',o:['Gewaltunternehmer haben kein Interesse an Frieden, weil der Krieg ihnen wirtschaftliche oder Machtvorteile sichert','Staaten führen Kriege ohne Zustimmung ihres Parlaments','Drohnen kämpfen ohne menschliche Steuerung','Jeder Staat darf sich selbst verteidigen'],e:'Krieg wird zum Dauerzustand, da die beteiligten Gewaltunternehmer vom Krieg profitieren.'},
 {t:'mc',q:'Welche Autoren werden im Text mit dem Begriff der „Neuen Kriege“ verbunden?',o:['Herfried Münkler und Mary Kaldor','Dieter Senghaas und Johan Galtung','António Guterres und Mark Rutte','Hugo Grotius und Carl von Clausewitz'],e:'Münkler und Kaldor prägten die Debatte um die „Neuen Kriege“ seit den 1990er-Jahren. Senghaas gehört zum Hexagon.'},
 {t:'multi',q:'Was gehört laut Text zur hybriden Kriegführung?',r:['Gezielte Desinformationskampagnen','Wirtschaftlicher Druck','Sabotage kritischer Infrastrukturen','Angriffe im digitalen Raum (Cyberwarfare)'],w:['Eine offizielle Kriegserklärung','Einsatz von UN-Blauhelmen','Ein klar erkennbarer Angreifer'],e:'Hybrid = verdeckte Kombination militärischer und nicht-militärischer Mittel. Typisch: Die Täterschaft soll gerade NICHT erkennbar sein.'},
 {t:'mc',q:'Welches Problem schafft hybride Kriegführung bewusst?',o:['Die Zuordnung der Täterschaft (Attribution) wird erschwert','Es gibt zu viele Kriegserklärungen','Blauhelme können nicht mehr neutral sein','Das Vetorecht wird abgeschafft'],e:'Attribution wird erschwert – deshalb greifen rechtliche und institutionelle Abwehrmechanismen schwer.'},
 {t:'mc',q:'Worin unterscheiden sich negativer und positiver Frieden?',o:['Negativ = Abwesenheit physischer Gewalt; positiv = zusätzlich keine strukturelle Gewalt und Gerechtigkeit','Negativ = Krieg; positiv = Waffenstillstand','Negativ = Frieden ohne UN-Mandat; positiv = mit UN-Mandat','Negativ = innerstaatlich; positiv = zwischenstaatlich'],e:'Der erweiterte Friedensbegriff: positiver Frieden umfasst das Fehlen struktureller Gewalt und die Präsenz von Gerechtigkeit.'},
 {t:'input',q:'Wer entwickelte das Zivilisatorische Hexagon? (Nachname)',a:['senghaas','dieter senghaas'],e:'Dieter Senghaas: dauerhafter Frieden nur durch das Zusammenspiel von sechs Bedingungen.'},
 {t:'multi',q:'Welche Bedingungen gehören zum Zivilisatorischen Hexagon?',r:['Gewaltmonopol (Entprivatisierung von Gewalt)','Rechtsstaatlichkeit','Interdependenz und Affektkontrolle','Demokratische Partizipation','Soziale Gerechtigkeit','Konstruktive Konfliktkultur'],w:['Nichteinmischungsprinzip','Militärische Abschreckung','Freie Marktwirtschaft'],e:'Die sechs Ecken: Gewaltmonopol, Rechtsstaatlichkeit, Interdependenz/Affektkontrolle, demokratische Partizipation, soziale Gerechtigkeit, konstruktive Konfliktkultur.'},
 {t:'mc',q:'„Das Gewaltmonopol muss kontrolliert werden, um Willkür zu verhindern.“ Welche Hexagon-Bedingung?',o:['Rechtsstaatlichkeit','Gewaltmonopol','Demokratische Partizipation','Konstruktive Konfliktkultur'],e:'Rechtsstaatlichkeit kontrolliert das Gewaltmonopol. Das Gewaltmonopol selbst entzieht dem Einzelnen die Selbstjustiz.'},
 {t:'mc',q:'In einem Failing State kontrollieren Milizen Stadtviertel und treiben „Schutzgeld“ ein. Welche Säule des Hexagons ist zuerst zusammengebrochen?',o:['Entprivatisierung von Gewalt (Gewaltmonopol)','Soziale Gerechtigkeit','Interdependenz und Affektkontrolle','Demokratische Partizipation'],e:'Wenn private Gewaltakteure herrschen, gibt es kein staatliches Gewaltmonopol mehr – Gewalt ist „reprivatisiert“. Das passt zur Dynamik der Neuen Kriege.'},
 {t:'mc',q:'Eine Regierung schließt eine ethnische Gruppe dauerhaft von Wahlen und Ämtern aus. Welche Bedingung des Hexagons ist verletzt?',o:['Demokratische Partizipation','Rechtsstaatlichkeit','Gewaltmonopol','Interdependenz und Affektkontrolle'],e:'Demokratische Partizipation = Einbindung aller Gruppen zur Relevanzminderung von Gewalt.'},
 {t:'mc',q:'„Sicherung der Grundbedürfnisse und Behebung von Ausgrenzung“ beschreibt …',o:['Soziale Gerechtigkeit','Konstruktive Konfliktkultur','Rechtsstaatlichkeit','Demokratische Partizipation'],e:'Soziale Gerechtigkeit – im Material markiert.'},
 {t:'mc',q:'Was passiert laut Text, wenn eine Säule des Hexagons einbricht – etwa in einem Failing State?',o:['Das Risiko eines Rückfalls in bewaffnete Konflikte steigt drastisch','Der UN-Sicherheitsrat muss automatisch eingreifen','Der Staat verliert seine UN-Mitgliedschaft','Die übrigen fünf Säulen gleichen das automatisch aus'],e:'Bricht eine Säule ein, steigt das Rückfallrisiko drastisch.'},
 {t:'mc',q:'Ein Staat greift an, um einem erwarteten Angriff des Gegners zuvorzukommen. Welcher Kriegstyp aus deinem Tafelbild?',o:['Präventivkrieg','Bürgerkrieg','Ideologischer Krieg','Hybrider Krieg'],e:'Präventivkrieg. Achtung: Völkerrechtlich ist das KEINE Ausnahme vom Gewaltverbot.'},
 {t:'input',q:'Welche internationalen Abkommen regeln den Schutz der Zivilbevölkerung im Krieg? (Genfer …)',a:['konventionen','genfer konventionen','konvention','genfer konvention'],e:'Genfer Konventionen (plus Völkerstrafrecht).'},
]},
{key:'U',code:'Q3/03',title:'Die Vereinten Nationen',sub:'Charta · Hauptorgane · Gewaltverbot · kollektive Sicherheit · Blauhelme',q:[
 {t:'input',q:'Wie viele Mitgliedstaaten hat die UNO?',a:['193'],e:'193 Staaten. Kosovo und Palästina gehören nicht dazu, der Vatikan ist „aktives Nichtmitglied“.'},
 {t:'input',q:'In welchem Jahr wurde die UNO gegründet?',a:['1945'],e:'1945, nach dem Zweiten Weltkrieg.'},
 {t:'mc',q:'Welches Dokument wird oft als „Weltverfassung“ bezeichnet?',o:['Die Charta der Vereinten Nationen','Die Genfer Konventionen','Der Nordatlantikvertrag','Das Budapester Memorandum'],e:'Die UN-Charta ist Grundlage der Völkerrechtsordnung seit 1945.'},
 {t:'multi',q:'Welche sind Hauptorgane der UNO?',r:['Generalversammlung','Sicherheitsrat','Sekretariat','Internationaler Gerichtshof','Wirtschafts- und Sozialrat (ECOSOC)','Treuhandrat'],w:['UNICEF','Weltgesundheitsorganisation (WHO)','Nordatlantikrat'],e:'Sechs Hauptorgane – der Treuhandrat ist heute inaktiv, zählt aber dazu. UNICEF ist Nebenorgan, die WHO Sonderorganisation.'},
 {t:'mc',q:'Welche Wirkung haben Beschlüsse der Generalversammlung, die über die interne Organisation hinausgehen?',o:['Keine Bindungswirkung – es sind Empfehlungen','Sie sind für alle Staaten völkerrechtlich bindend','Sie binden nur die Staaten, die zugestimmt haben, militärisch','Sie gelten erst nach Zustimmung des IGH'],e:'GV-Beschlüsse sind nur Empfehlungen. Bindend (Art. 25) sind Beschlüsse des Sicherheitsrats.'},
 {t:'mc',q:'Nach welchem Prinzip stimmt die Generalversammlung ab?',o:['Ein Staat – eine Stimme','Stimmen nach Bevölkerungszahl','Stimmen nach Höhe der Beiträge','Nur die P5 haben volles Stimmrecht'],e:'„Ein Staat – eine Stimme“ (souveräne Gleichheit).'},
 {t:'multi',q:'Welche Staaten sind ständige Mitglieder des Sicherheitsrats?',r:['China','Frankreich','Großbritannien','Russland','USA'],w:['Deutschland','Indien','Japan'],e:'P5: China, Frankreich, Großbritannien, Russland, USA. Dazu 10 nichtständige Mitglieder für je 2 Jahre.'},
 {t:'mc',q:'Wann kommt laut Art. 27 eine Entscheidung im Sicherheitsrat zustande?',o:['Mindestens 9 von 15 stimmen zu und keines der fünf ständigen Mitglieder stimmt mit Nein','Alle 15 Mitglieder müssen zustimmen','Eine einfache Mehrheit von 8 Stimmen genügt','Die P5 müssen alle mit Ja stimmen'],e:'9 von 15 + kein Nein eines ständigen Mitglieds. Eine Enthaltung zählt NICHT als Ablehnung.'},
 {t:'tf',q:'Enthält sich ein ständiges Mitglied, ist eine Resolution automatisch gescheitert.',a:false,e:'Enthaltung ≠ Veto. Nur ein ausdrückliches Nein eines P5-Staates blockiert.'},
 {t:'input',q:'In welchem Artikel der UN-Charta steht das allgemeine Gewaltverbot? (Format: Art. _ Nr. _)',a:['art 2 nr 4','art 2 abs 4','2 nr 4','2 abs 4','artikel 2 absatz 4','art. 2 nr. 4','art 2 ziff 4','2 ziffer 4'],e:'Art. 2 Nr. 4 (auch: Ziffer bzw. Abs. 4): Verbot von Androhung und Anwendung von Gewalt gegen die territoriale Unversehrtheit oder politische Unabhängigkeit eines Staates.'},
 {t:'multi',q:'Welche Ausnahmen vom allgemeinen Gewaltverbot erlaubt die Charta?',r:['Selbstverteidigung nach einem bewaffneten Angriff (Art. 51), auch kollektiv','Vom Sicherheitsrat autorisierte Zwangsmaßnahmen nach Kapitel VII'],w:['Humanitäre Intervention ohne UN-Mandat','Präventivkrieg gegen eine vermutete Bedrohung','Militäreinsatz nach einem Beschluss der Generalversammlung'],e:'Nur zwei Ausnahmen: Art. 51 (bis der SR handelt) und SR-Autorisierung. Kosovo 1999 war ohne Mandat – legitim, aber nicht legal.'},
 {t:'input',q:'Welcher Artikel der Charta regelt das Recht auf Selbstverteidigung? (Zahl)',a:['51','art 51','artikel 51'],e:'Art. 51 – Staaten dürfen sich verteidigen und um kollektiven Beistand bitten (z. B. NATO).'},
 {t:'mc',q:'Welche Aufgabe überträgt Art. 24 dem Sicherheitsrat?',o:['Die Hauptverantwortung für den Weltfrieden und die internationale Sicherheit','Die Verwaltung des UN-Haushalts','Die Wahl des IGH-Präsidenten','Die Aufnahme von Sonderorganisationen'],e:'Art. 24: vorrangige Verantwortung für Frieden und Sicherheit.'},
 {t:'mc',q:'Art. 43 sieht vor, dass Mitgliedstaaten der UNO Streitkräfte zur Verfügung stellen. Was wurde daraus?',o:['Es kam nie dazu, weil die Staaten die Verfügungsgewalt über ihre Truppen nicht abgeben wollten','Die UNO hat seitdem eine eigene stehende Armee','Nur die P5 stellen dauerhaft Truppen','Die NATO übernimmt diese Aufgabe automatisch'],e:'Nie umgesetzt. Deshalb entstand das Peacekeeping mit Blauhelmen als eigene Form.'},
 {t:'mc',q:'Was kennzeichnet UN-Friedensmissionen in ihrer KLASSISCHEN Form?',o:['Unbewaffnete Beobachter oder leicht bewaffnete Truppen, strikt neutral, überwachen einen Waffenstillstand','Robuste Mandate mit Kampfeinsätzen gegen Friedensstörer','Wiederaufbau ganzer Staaten (peacebuilding)','Durchsetzung von Handelsembargos'],e:'Klassisch = Beobachtung, Neutralität, Puffer zwischen regulären Armeen. Robuste Mandate und peacebuilding kamen nach dem Kalten Krieg hinzu.'},
 {t:'sort',q:'Welche Mission gehört wohin?',cats:{'Beobachtungsmission 1940er':['UNTSO – Waffenstillstand in Palästina','UNMOGIP – Kaschmir zwischen Indien und Pakistan'],'Peacebuilding nach Konflikt':['Bosnien-Herzegowina','Kosovo','Ost-Timor','Sierra Leone']},e:'UNTSO und UNMOGIP sind frühe Beobachtungsmissionen. Bosnien, Kosovo, Ost-Timor, Sierra Leone stehen für post-conflict peacebuilding.'},
 {t:'mc',q:'Warum stieg die Zahl der UN-Friedensmissionen nach 1988 sprunghaft an?',o:['Größere Handlungsfähigkeit des Sicherheitsrats nach dem Ende der Blockkonfrontation und Hinwendung zu innerstaatlichen Konflikten','Weil die UNO 1988 eine eigene Armee bekam','Weil das Vetorecht 1988 abgeschafft wurde','Weil die NATO keine Einsätze mehr durchführen durfte'],e:'1988–1992 wurden mehr Operationen begonnen als in den 45 Jahren davor.'},
 {t:'input',q:'Wie viele Friedensmissionen führte die UNO zwischen 1948 und 1988 durch?',a:['13'],e:'13 – vor allem in Afrika (Kongo), Asien (Kaschmir), Nahost (Palästina/Sinai) und Europa (Zypern).'},
 {t:'mc',q:'Wer leitet das Sekretariat (Stand 2026) und welche Rolle hat es?',o:['António Guterres; reines Verwaltungsorgan ohne eigene Entscheidungsbefugnisse','Mark Rutte; entscheidet über Militäreinsätze','António Guterres; kann Sanktionen verhängen','Ursula von der Leyen; vertritt die UNO nach außen'],e:'Guterres (Portugal) seit 2017; Amtszeit endet am 31.12.2026. Das Sekretariat handelt im Auftrag von GV und SR.'},
 {t:'mc',q:'Wo sitzt der Internationale Gerichtshof?',o:['Den Haag','New York','Genf','Wien'],e:'IGH in Den Haag. Fünf Hauptorgane sitzen in New York; Außenstellen des Sekretariats in Genf, Nairobi und Wien.'},
 {t:'mc',q:'Welche „Grundspannung“ prägt laut Text die Arbeit der UNO?',o:['Staaten schließen sich als souverän Gleiche zusammen – zugleich soll die UNO ihre souveränen Rechte zugunsten gemeinsamer Interessen begrenzen','Spannung zwischen NATO und Warschauer Pakt','Konflikt zwischen Sekretariat und IGH','Streit zwischen Sonderorganisationen um Spendengelder'],e:'Souveräne Gleichheit vs. Begrenzung der Souveränität (Gewalt, Menschenrechte, Klima). Staaten versuchen dabei, möglichst viele eigene Interessen durchzusetzen.'},
 {t:'tf',q:'Laut Text ist die UNO „so stark oder so schwach, wie es ihre Mitgliedstaaten wollen“.',a:true,e:'Genau das ist das Fazit des Textes – alle Handlungsmöglichkeiten liegen in den Händen der Mitgliedstaaten, vor allem der großen Mächte.'},
 {t:'mc',q:'Warum war der Sicherheitsrat im Kalten Krieg massiv eingeschränkt?',o:['USA und Sowjetunion setzten ihr Veto fast gewohnheitsmäßig ein','Weil er nur 5 Mitglieder hatte','Weil die Generalversammlung ihn überstimmen konnte','Weil Deutschland ein Vetorecht hatte'],e:'Gegenseitige Blockade per Veto.'},
]},
{key:'S',code:'Q3/04',title:'Sanktionen & UN-System',sub:'Kapitel VII · Art. 39/41/42 · Sonderorganisationen vs. Nebenorgane',q:[
 {t:'order',q:'Bringe den Weg zu einer UN-Sanktion in die richtige Reihenfolge.',items:['Feststellung einer Bedrohung oder eines Bruchs des Weltfriedens (Art. 39)','Abstimmung: mind. 9 von 15 Stimmen, kein Veto der P5','Umsetzung durch die Staaten, Überwachung durch einen Sanktionsausschuss','Überprüfung: befristet, dann verlängert, verschärft oder beendet'],e:'Feststellen → Auswählen/Abstimmen → Überwachen → Überprüfen. Ohne Schritt 1 (Art. 39) keine Zwangsmaßnahmen.'},
 {t:'sort',q:'Nichtmilitärisch (Art. 41) oder militärisch (Art. 42)?',cats:{'Art. 41':['Handelsembargo','Einfrieren von Vermögenswerten','Reiseverbote für Einzelpersonen','Waffenembargo','Abbruch diplomatischer Beziehungen'],'Art. 42':['Autorisierung von Luft-, See- oder Landstreitkräften','Einsatz gegen den Irak nach der Invasion Kuwaits 1990/91']},e:'Art. 41 = Sanktionen ohne Waffengewalt. Art. 42 = letztes Mittel, wenn Art. 41 nicht reicht.'},
 {t:'input',q:'Nach welchem Artikel stellt der Sicherheitsrat zuerst fest, ob der Weltfrieden bedroht ist? (Zahl)',a:['39','art 39','artikel 39'],e:'Art. 39 – erst danach sind Zwangsmaßnahmen nach Art. 41/42 möglich.'},
 {t:'mc',q:'Welches Kapitel der UN-Charta ist die Rechtsgrundlage für Zwangsmaßnahmen?',o:['Kapitel VII','Kapitel I','Kapitel XIV','Kapitel V'],e:'Kapitel VII: Maßnahmen bei Bedrohung oder Bruch des Friedens und bei Angriffshandlungen.'},
 {t:'tf',q:'Die 17 Sanktionspakete der EU gegen Russland sind für alle 193 UN-Staaten rechtlich bindend.',a:false,e:'Das sind unilaterale Sanktionen. Bindend für alle sind nur Sanktionen des Sicherheitsrats – und die blockiert Russland per Veto.'},
 {t:'sort',q:'Sonderorganisation oder Nebenorgan/Programm?',cats:{'Sonderorganisation':['WHO','UNESCO','ILO','FAO','IWF','Weltbank'],'Nebenorgan / Programm':['UNICEF','UNHCR','WFP','UNDP']},e:'Sonderorganisationen: eigener Vertrag, eigenes Budget, eigener Beitritt. Nebenorgane: direkt der UNO unterstellt, meist spendenfinanziert.'},
 {t:'multi',q:'Was trifft auf SONDERORGANISATIONEN zu?',r:['Eigener Gründungsvertrag, völkerrechtlich selbstständig','Eigenes Budget und eigene Beschlussgremien','Staaten können eigenständig ein- oder austreten'],w:['Keine eigene Rechtspersönlichkeit','Meist von der Generalversammlung eingerichtet','Finanzierung fast nur durch freiwillige Spenden'],e:'Die falschen Antworten beschreiben Nebenorgane wie UNICEF.'},
 {t:'mc',q:'Welches Beispiel zeigt, dass man aus einer Sonderorganisation austreten kann?',o:['USA 1984 aus der UNESCO','Deutschland 1955 aus der NATO','Russland 2022 aus dem Sicherheitsrat','Großbritannien 2016 aus UNICEF'],e:'USA 1984 – UNESCO. Bei Nebenorganen gibt es keinen eigenen Austritt.'},
 {t:'mc',q:'WHO: Gründung, Sitz, Mitglieder?',o:['1948 · Genf · 194','1945 · New York · 193','1946 · Wien · 190','1949 · Brüssel · 32'],e:'WHO 1948, Genf, 194 Mitgliedstaaten. Kritik: kein eigenes Durchsetzungsrecht.'},
 {t:'mc',q:'Wie finanziert sich UNICEF?',o:['Fast vollständig durch freiwillige Spenden von Regierungen, Unternehmen und Privatpersonen','Durch Pflichtbeiträge aller Mitgliedstaaten','Durch Kredite des IWF','Durch Strafzahlungen aus Sanktionen'],e:'Als Nebenorgan hat UNICEF kein Pflichtbudget. Gegründet 1946, aktiv in über 190 Ländern und Gebieten.'},
 {t:'mc',q:'Welche UN-Institution erhielt 1954 und 1981 den Friedensnobelpreis?',o:['UNHCR','WFP','UNDP','WHO'],e:'UNHCR – Schutz Geflüchteter und Binnenvertriebener.'},
 {t:'mc',q:'Welches Sanktionsregime besteht seit 2006 wegen eines Atom- und Raketenprogramms?',o:['Nordkorea','Mali','Jemen','Somalia'],e:'Nordkorea seit 2006. Somalia: Waffenembargo gegen Al-Shabaab; DR Kongo: Waffen und Rohstoffhandel.'},
 {t:'multi',q:'Welche Kritikpunkte an Sanktionen nennt das Material?',r:['Humanitäre Folgen für die Zivilbevölkerung (z. B. Irak 1990–2003)','Fragliche Wirksamkeit gegenüber autoritären Regierungen','Umgehung durch Drittstaaten und Schattenflotten','Blockade durch das Vetorecht'],w:['Sanktionen sind grundsätzlich völkerrechtswidrig','Sanktionen dürfen nur von der NATO verhängt werden'],e:'Vier Kritikpunkte: humanitäre Folgen, Wirksamkeit, Umgehung, Veto-Blockade.'},
 {t:'mc',q:'Warum reagierten EU und USA auf den Ukraine-Krieg mit eigenen statt UN-Sanktionen?',o:['Russland ist ständiges Mitglied und kann jede Resolution gegen sich per Veto blockieren','Die UNO darf grundsätzlich keine Sanktionen gegen Atommächte verhängen','Die Generalversammlung hatte Sanktionen verboten','Die UN-Charta kennt keine Wirtschaftssanktionen'],e:'Grenze kollektiver Sicherheit: Gegen P5 (und enge Verbündete) sind bindende UN-Sanktionen praktisch nicht durchsetzbar.'},
 {t:'mc',q:'Wer setzt UN-Sanktionen konkret um?',o:['Die einzelnen Mitgliedstaaten (z. B. nationale Ein- und Ausfuhrverbote); ein Sanktionsausschuss überwacht','Das Sekretariat mit eigener Polizei','Der Internationale Gerichtshof','Die NATO'],e:'Die UNO hat keine eigenen Machtmittel – Umsetzung liegt bei den Staaten.'},
 {t:'mc',q:'Wie nennt der UN-Text Sanktionen wie Waffenembargos oder Handelsbeschränkungen auf Englisch?',o:['peace making','peacekeeping','peacebuilding','use of military force'],e:'Sanktionen = peace making; Autorisierung militärischer Gewalt = use of military force; Blauhelme = peacekeeping; Wiederaufbau = peacebuilding.'},
 {t:'sort',q:'Ordne den Fachbegriff zu.',cats:{'peacekeeping':['Blauhelme überwachen neutral einen Waffenstillstand'],'peace making':['Waffenembargo gegen einen Friedensstörer'],'peacebuilding':['Wiederaufbau von Staat und Verwaltung nach einem Bürgerkrieg'],'use of military force':['Autorisierung militärischer Gewalt wie Irak 1990']},e:'Vier Stufen des UN-Instrumentariums – eine beliebte Klausurfalle.'},
]},
{key:'UA',code:'Q3/05',title:'Der Ukraine-Krieg',sub:'Vorgeschichte 1991–2022 · Kriegsverlauf · Unterstützer & Motive',q:[
 {t:'order',q:'Bringe die Vorgeschichte in die richtige Reihenfolge.',items:['Unabhängigkeit der Ukraine','Budapester Memorandum','Euromaidan','Annexion der Krim','Minsk II','Truppenaufmarsch an der Grenze','Vollinvasion'],e:'1991 → 1994 → 2013/14 → Feb./März 2014 → Feb. 2015 → 2021 → 24.02.2022.'},
 {t:'order',q:'Kriegsverlauf 2022: Was geschah zuerst?',items:['Angriff aus drei Richtungen, auch auf Kyjiw','Rückzug russischer Truppen aus dem Norden','Ukrainische Gegenoffensive bei Charkiw','Rückeroberung von Cherson'],e:'24.02. → März/April → September → November 2022.'},
 {t:'mc',q:'Was regelte das Budapester Memorandum (5.12.1994)?',o:['Die Ukraine gibt ihre Kernwaffen ab; Russland, USA und Großbritannien sichern Souveränität und territoriale Unversehrtheit zu','Die Ukraine tritt der NATO bei','Russland erhält die Krim für 50 Jahre','Die OSZE überwacht einen Waffenstillstand im Donbass'],e:'Ukraine hatte das drittgrößte Kernwaffenarsenal der Welt. Wichtig: Eine verbindliche Militärhilfe-Garantie enthielt das Memorandum NICHT.'},
 {t:'tf',q:'Das Budapester Memorandum verpflichtete die USA und Großbritannien, der Ukraine im Angriffsfall militärisch beizustehen.',a:false,e:'Keine verbindliche Militärhilfe-Garantie – der rechtliche Status ist bis heute umstritten.'},
 {t:'mc',q:'Was löste den Euromaidan aus?',o:['Präsident Janukowytsch lehnte auf Druck Moskaus ein fertig verhandeltes EU-Assoziierungsabkommen ab','Russland annektierte die Krim','Die NATO lud die Ukraine zum Beitritt ein','Selenskyj wurde zum Präsidenten gewählt'],e:'November 2013; über 100 Tote bei der Eskalation; am 22.02.2014 wurde Janukowytsch abgesetzt und floh nach Russland.'},
 {t:'sort',q:'Ordne die Personen zu.',cats:{'Präsident der Ukraine 2010–2014':['Viktor Janukowytsch'],'Präsident der Ukraine 2014–2019':['Petro Poroschenko'],'Präsident der Ukraine seit 2019':['Wolodymyr Selenskyj'],'Präsident Russlands':['Wladimir Putin']},e:'Poroschenko amtierte während Krim-Annexion, Donbass-Krieg und Minsker Abkommen.'},
 {t:'mc',q:'Wer waren die „grünen Männchen“?',o:['Unmarkierte, bewaffnete Soldaten, die Ende Februar 2014 Gebäude und Stützpunkte auf der Krim besetzten','Ukrainische Freiwillige im Donbass','OSZE-Beobachter','Blauhelme der UNO'],e:'Russland bestritt zunächst jede Beteiligung – Wochen später räumte Putin sie ein. Ein Beispiel für hybride Kriegführung.'},
 {t:'mc',q:'Krim-Referendum am 16. März 2014 – was stimmt?',o:['Offiziell 97 % für den Anschluss, ohne internationale Beobachter und unter militärischer Präsenz; völkerrechtlich nicht anerkannt','Von der UNO überwacht und anerkannt','Die Mehrheit stimmte für den Verbleib in der Ukraine','Es fand erst 2022 statt'],e:'Die Angliederung gilt völkerrechtlich als Annexion. Strategisch wichtig: Sewastopol, Hauptstützpunkt der Schwarzmeerflotte.'},

const P5=['USA','Russland','China','Frankreich','Großbritannien'];
const P5K=['USA','RUS','CHN','FRA','GBR'];
function makeVote(){
  const kind=['veto','pass_abst','few','pass_nein','veto_abst'][Math.floor(Math.random()*5)];
  let p5=['ja','ja','ja','ja','ja'], e10=Array(10).fill('ja');
  const setRand=(arr,val,n)=>{shuffle([...arr.keys()]).filter(i=>arr[i]==='ja').slice(0,n).forEach(i=>arr[i]=val)};
  if(kind==='veto'){ setRand(p5,'nein',1); setRand(p5,'enth',Math.floor(Math.random()*2)); setRand(e10,'enth',Math.floor(Math.random()*3)); }
  if(kind==='veto_abst'){ setRand(p5,'nein',1); setRand(p5,'enth',1); setRand(e10,'nein',1); setRand(e10,'enth',1); }
  if(kind==='pass_abst'){ setRand(p5,'enth',1+Math.floor(Math.random()*2)); setRand(e10,'enth',Math.floor(Math.random()*3)); }
  if(kind==='pass_nein'){ setRand(e10,'nein',1+Math.floor(Math.random()*3)); setRand(p5,'enth',Math.floor(Math.random()*2)); }
  if(kind==='few'){ setRand(p5,'enth',1+Math.floor(Math.random()*2)); const yes=()=>p5.concat(e10).filter(v=>v==='ja').length; while(yes()>=9) setRand(e10,Math.random()<.5?'enth':'nein',1); }
  // Kontrolle der Logik
  const all=p5.concat(e10), ja=all.filter(v=>v==='ja').length, nein=all.filter(v=>v==='nein').length, enth=15-ja-nein;
  const veto=p5.includes('nein');
  if(veto && ja<9) return makeVote();
  const res=veto?'veto':(ja>=9?'pass':'few');
  const label={pass:'Angenommen',veto:'Gescheitert – Veto eines ständigen Mitglieds',few:'Gescheitert – weniger als 9 Ja-Stimmen'};
  const why= res==='veto' ? `${P5[p5.indexOf('nein')]} stimmt als ständiges Mitglied mit Nein. Das ist ein Veto – egal, dass ${ja} Staaten zugestimmt haben.`
    : res==='pass' ? `${ja} Ja-Stimmen (≥ 9) und kein Nein eines ständigen Mitglieds.`+(p5.includes('enth')?' Eine Enthaltung der P5 zählt nicht als Veto.':'')+(e10.includes('nein')?' Nein-Stimmen nichtständiger Mitglieder blockieren nicht.':'')
    : `Nur ${ja} Ja-Stimmen – nötig sind mindestens 9 von 15 (Art. 27).`;
  const topic=shuffle(['Waffenembargo gegen eine Bürgerkriegspartei','Einfrieren von Vermögen einer Terrormiliz','Verlängerung einer Blauhelm-Mission','Verurteilung einer Annexion','Reiseverbote gegen Regierungsmitglieder','Flugverbotszone zum Schutz von Zivilisten'])[0];
  return {t:'vote',p5,e10,ja,nein,enth,res,topic,o:[label[res],...Object.keys(label).filter(k=>k!==res).map(k=>label[k])],e:why,id:'V'};
}

function horseshoe(){
  // 15 Sitze im Hufeisen des Sicherheitsrats; die 5 ständigen hervorgehoben
  let c='';for(let i=0;i<15;i++){const a=Math.PI*(0.08+0.84*i/14);const x=75-62*Math.cos(a),y=18+62*Math.sin(a);const p=[0,3,7,11,14].includes(i);c+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${p?7:5}" fill="${p?'#e6b43c':'#4f6a86'}"/>`}
  return `<svg class="horseshoe" viewBox="0 0 150 95" role="img" aria-label="Sitzordnung des Sicherheitsrats: 15 Sitze, 5 ständige hervorgehoben">${c}<text x="75" y="40" text-anchor="middle" fill="#8fa3b8" font-family="IBM Plex Mono,monospace" font-size="9">9 / 15</text></svg>`;
}

function start(key){
  let pool, title, n=12, code;
  if(key==='FINAL'){pool=ALLQ.filter(q=>q.t!=='vote');pool=shuffle(pool).slice(0,17).concat([{t:'vote'},{t:'vote'},{t:'vote'}]);title='Abschlussprüfung';code='Q3/09';n=20}
  else if(key==='MIX'){pool=shuffle(ALLQ).slice(0,15);title='Schnellrunde';code='MIX';n=15}
  else if(key==='WRONG'){pool=shuffle(store.wrong.map(id=>BYID[id]).filter(Boolean)).slice(0,15);title='Fehlerkartei';code='FEHLER';n=pool.length}
  else{const d=D.find(x=>x.key===key);pool=d.q;title=d.title;code=d.code;n=Math.min(12,pool.length)}
  let qs=key==='FINAL'||key==='WRONG'||key==='MIX'?shuffle(pool):shuffle(pool).slice(0,n);
  qs=qs.map(q=>q.t==='vote'?makeVote():q);
  const maxH=key==='FINAL'?4:key==='WRONG'?5:3;
  G={key,title,code,qs,i:0,hearts:maxH,maxH,score:0,streak:0,firstRight:0,firstTotal:qs.length,retry:[],retried:new Set(),log:[],answered:false};
  document.body.classList.add('inquiz');
  renderQ();
}

function rMC(q,b){
  const opts=shuffle(q.o.map((t,i)=>({t,ok:i===0})));
  b.innerHTML=`<h2 class="qtext">${esc(q.q)}</h2><div class="opts">${opts.map((o,i)=>`<button class="opt" data-i="${i}"><span class="k">${i+1}</span><span>${esc(o.t)}</span></button>`).join('')}</div>`;
  const btns=[...b.querySelectorAll('.opt')];
  btns.forEach((x,i)=>x.onclick=()=>{ if(G.answered)return;
    btns.forEach((y,j)=>{y.disabled=true; if(opts[j].ok) y.classList.add('right')}); if(!opts[i].ok) x.classList.add('wrong');
    finish(opts[i].ok, opts[i].ok?'':'Richtig wäre: '+opts.find(o=>o.ok).t);
  });
  G.solText='Richtig wäre: '+q.o[0]; G.keys=btns;
}
function rTF(q,b){
  b.innerHTML=`<h2 class="qtext">${esc(q.q)}</h2><div class="tf"><button class="opt" data-v="1"><span class="k">1</span>Stimmt</button><button class="opt" data-v="0"><span class="k">2</span>Stimmt nicht</button></div>`;
  const btns=[...b.querySelectorAll('.opt')];
  btns.forEach(x=>x.onclick=()=>{ if(G.answered)return; const v=x.dataset.v==='1', ok=v===q.a;
    btns.forEach(y=>{y.disabled=true; if((y.dataset.v==='1')===q.a) y.classList.add('right')}); if(!ok)x.classList.add('wrong');
    finish(ok, ok?'':'Die Aussage '+(q.a?'stimmt.':'stimmt nicht.'));
  });
  G.solText='Die Aussage '+(q.a?'stimmt.':'stimmt nicht.'); G.keys=btns;
}
function rMulti(q,b){
  const opts=shuffle(q.r.map(t=>({t,ok:true})).concat(q.w.map(t=>({t,ok:false}))));
  b.innerHTML=`<h2 class="qtext">${esc(q.q)}<small>Mehrere Antworten sind richtig. Wie viele, wird nicht verraten.</small></h2><div class="opts">${opts.map((o,i)=>`<button class="opt" aria-pressed="false"><span class="k">${i+1}</span><span>${esc(o.t)}</span></button>`).join('')}</div>`;
  const btns=[...b.querySelectorAll('.opt')];
  btns.forEach(x=>x.onclick=()=>{ if(G.answered)return; x.setAttribute('aria-pressed',x.getAttribute('aria-pressed')==='true'?'false':'true'); $('#chk').disabled=!btns.some(y=>y.getAttribute('aria-pressed')==='true')});
  checkBtn(()=>{ let ok=true;
    btns.forEach((y,j)=>{const on=y.getAttribute('aria-pressed')==='true';y.disabled=true;
      if(on&&opts[j].ok)y.classList.add('right'); else if(on&&!opts[j].ok){y.classList.add('wrong');ok=false} else if(!on&&opts[j].ok){y.classList.add('missed');ok=false}});
    finish(ok, ok?'':'Richtig sind: '+q.r.join(' · '));
  },false);
  G.solText='Richtig sind: '+q.r.join(' · '); G.keys=btns;
}
function rSort(q,b){
  const cats=Object.keys(q.cats);
  let items=Object.entries(q.cats).flatMap(([c,arr])=>arr.map(t=>({t,c})));
  if(items.length>8){ // höchstens 8 Elemente, aber jede Kategorie mindestens einmal
    const pick=cats.map(c=>shuffle(items.filter(x=>x.c===c))[0]);
    items=pick.concat(shuffle(items.filter(x=>!pick.includes(x))).slice(0,8-pick.length));
  }
  items=shuffle(items); const ans=Array(items.length).fill(null);
  b.innerHTML=`<h2 class="qtext">${esc(q.q)}</h2><div>${items.map((it,i)=>`<div class="sortrow"><div class="item">${esc(it.t)}</div><div class="seg" role="group">${cats.map(c=>`<button data-i="${i}" data-c="${esc(c)}" aria-pressed="false">${esc(c)}</button>`).join('')}</div></div>`).join('')}</div>`;
  const all=[...b.querySelectorAll('.seg button')];
  all.forEach(x=>x.onclick=()=>{ if(G.answered)return; const i=+x.dataset.i; ans[i]=x.dataset.c;
    all.filter(y=>+y.dataset.i===i).forEach(y=>y.setAttribute('aria-pressed',y===x?'true':'false')); $('#chk').disabled=ans.includes(null)});
  checkBtn(()=>{ let wrong=0;
    all.forEach(y=>{y.disabled=true;const i=+y.dataset.i,c=y.dataset.c; if(ans[i]===c&&items[i].c===c)y.classList.add('right'); else if(ans[i]===c){y.classList.add('wrong');} else if(items[i].c===c&&ans[i]!==c) y.classList.add('missed')});
    items.forEach((it,i)=>{if(ans[i]!==it.c)wrong++});
    finish(wrong===0, wrong?wrong+' von '+items.length+' falsch zugeordnet. Die gestrichelten Felder sind richtig.':'');
  },false);
}
function rOrder(q,b){
  const pool=shuffle(q.items.map((t,i)=>({t,i}))); const seq=[];
  b.innerHTML=`<h2 class="qtext">${esc(q.q)}<small>Tippe die Einträge in der richtigen Reihenfolge an. Tippe oben auf einen Eintrag, um ihn zurückzulegen.</small></h2><div class="seq" id="seq"></div><div class="pool" id="pool"></div>`;
  const draw=()=>{
    $('#seq').innerHTML=q.items.map((_,k)=>seq[k]?`<button class="slot filled" data-k="${k}"><span class="n">${k+1}.</span><span>${esc(seq[k].t)}</span></button>`:`<div class="slot"><span class="n">${k+1}.</span></div>`).join('');
    $('#pool').innerHTML=pool.filter(p=>!seq.includes(p)).map(p=>`<button data-i="${p.i}">${esc(p.t)}</button>`).join('');
    $('#seq').querySelectorAll('button').forEach(x=>x.onclick=()=>{if(G.answered)return;seq.splice(+x.dataset.k,1);draw()});
    $('#pool').querySelectorAll('button').forEach(x=>x.onclick=()=>{if(G.answered)return;seq.push(pool.find(p=>p.i===+x.dataset.i));draw()});
    const c=$('#chk'); if(c) c.disabled=seq.length!==q.items.length;
  };
  checkBtn(()=>{ let wrong=0; $('#seq').querySelectorAll('.slot').forEach((s,k)=>{s.disabled=true;if(seq[k].i===k)s.classList.add('right');else{s.classList.add('wrong');wrong++}});
    finish(wrong===0, wrong?'Richtige Reihenfolge: '+q.items.map((t,k)=>(k+1)+'. '+t).join(' → '):'');
  },false);
  G.solText='Richtige Reihenfolge: '+q.items.join(' → ');
  draw();
}
function rInput(q,b){
  b.innerHTML=`<h2 class="qtext">${esc(q.q)}</h2><form class="inp" id="f"><input id="ans" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Deine Antwort" placeholder="Antwort eingeben"><button class="btn" id="chk">Prüfen</button></form>`;
  G.solText='Erwartet: '+q.a[0];
  const inp=$('#ans'); setTimeout(()=>inp.focus(),50);
  $('#f').onsubmit=e=>{e.preventDefault(); if(G.answered||!inp.value.trim())return;
    const v=inp.value, ok=q.a.some(a=>normTight(a)===normTight(v));
    inp.disabled=true; inp.classList.add(ok?'right':'wrong'); $('#chk').remove();
    finish(ok, ok?'':'Erwartet: '+q.a[0]);
  };
}
function rVote(q,b){
  const seat=(name,k,v,p)=>`<div class="seat ${v} ${p?'p5':''}"><b>${k}</b>${v==='ja'?'Ja':v==='nein'?'Nein':'Enth.'}</div>`;
  const opts=shuffle(q.o.map((t,i)=>({t,ok:i===0})));
  b.innerHTML=`<h2 class="qtext">Resolutionsentwurf: ${esc(q.topic)}. Wie geht die Abstimmung aus?<small>Dick umrandet: ständige Mitglieder. N1–N10: nichtständige Mitglieder.</small></h2>
   <div class="council">${q.p5.map((v,i)=>seat(P5[i],P5K[i],v,true)).join('')}${q.e10.map((v,i)=>seat('','N'+(i+1),v,false)).join('')}</div>
   <div class="opts">${opts.map((o,i)=>`<button class="opt"><span class="k">${i+1}</span><span>${esc(o.t)}</span></button>`).join('')}</div>`;
  const btns=[...b.querySelectorAll('.opt')];
  btns.forEach((x,i)=>x.onclick=()=>{ if(G.answered)return;
    btns.forEach((y,j)=>{y.disabled=true;if(opts[j].ok)y.classList.add('right')}); if(!opts[i].ok)x.classList.add('wrong');
    finish(opts[i].ok,'');
  });
  G.solText='Richtig: '+q.o[0]+'.'; G.keys=btns;
}

/* --- Auswertung einer Antwort --- */
function finish(ok,sol){
  if(G.answered)return; G.answered=true; clearInterval(timerId);
  const q=G.cur, first=!G.retried.has(G.i);
  let pts=0;
  if(ok){
    G.streak++; if(first)G.firstRight++;
    pts=Math.round(BASE[q.t]*(1+Math.min(G.streak-1,5)*0.1)*(store.timer?1.5:1)+(store.timer?Math.max(0,Math.round(G.tleft))*5:0));
    if(!first) pts=Math.round(pts/2);
    G.score+=pts;
    if(q.id && q.id!=='V'){ store.wrong=store.wrong.filter(x=>x!==q.id); }
  } else {
    G.streak=0; G.hearts--;
    if(q.id && q.id!=='V' && !store.wrong.includes(q.id)) store.wrong.push(q.id);
    if(first){ G.retry.push(q.t==='vote'?makeVote():q); }
    G.log.push(q);
    const c=$('#card'); c.classList.add('shake'); setTimeout(()=>c.classList.remove('shake'),400);
  }
  save();
  $('#fb').innerHTML=`<div class="fb ${ok?'':'bad'}" role="status"><span class="pts">${ok?'+'+pts:'−1 Leben'}</span><h4>${ok?'Richtig':'Falsch'}</h4>${sol?`<p class="sol">${esc(sol)}</p>`:''}<p>${esc(q.e||'')}</p></div>`;
  // Kopfzeile aktualisieren
  const h=document.querySelector('.hearts'); if(h) h.innerHTML=[...Array(G.maxH).keys()].map(i=>i<G.hearts?'●':'<span class="lost">●</span>').join(' ');
  const s=document.querySelector('.score'); if(s) s.textContent=G.score;
  const st=document.querySelector('.streak'); if(st) st.textContent=G.streak>=2?'Serie ×'+G.streak:'';
  setAct(`<button class="btn" id="nxt">${G.hearts<=0?'Auswertung':'Weiter'}</button>`);
  $('#nxt').onclick=next; $('#nxt').focus({preventScroll:true});
  G.keys=null;
}
function next(){
  if(G.hearts<=0) return result(false);
  G.i++;
  if(G.i>=G.qs.length){
    if(G.retry.length){ const start=G.qs.length; G.qs=G.qs.concat(G.retry); for(let k=start;k<G.qs.length;k++)G.retried.add(k); G.retry=[]; }
    else return result(true);
  }
  renderQ();
}
function result(passed){
  clearInterval(timerId); document.body.classList.remove('inquiz');
  const pct=G.firstTotal?Math.round(G.firstRight/G.firstTotal*100):0;
  let stars=0; if(passed){stars=1; if(pct>=75)stars=2; if(pct>=90)stars=3;}
  const isDossier=D.some(d=>d.key===G.key)||G.key==='FINAL';
  let newBest=false;
  if(isDossier){ if(stars>(store.stars[G.key]||0)) store.stars[G.key]=stars; if(passed && G.score>(store.best[G.key]||0)){store.best[G.key]=G.score;newBest=true} save(); }
  const uniq=[...new Map(G.log.map(q=>[q.id+(q.q||q.topic),q])).values()];
  app.innerHTML=`<main class="wrap result"><section class="card">
    <div class="mono" style="color:var(--muted)">${G.code} · ${esc(G.title)}</div>
    <h2>${passed?(stars===3?'Exzellent verhandelt.':stars===2?'Mission erfüllt.':'Knapp bestanden.'):'Mission gescheitert.'}</h2>
    <div class="bigstars">${[0,1,2].map(i=>i<stars?'★':'<span class="off">★</span>').join('')}</div>
    <div class="kpis">
      <div class="kpi"><b>${G.score}</b><span>Punkte${newBest?' · neuer Rekord':''}</span></div>
      <div class="kpi"><b>${pct} %</b><span>beim ersten Versuch richtig</span></div>
      <div class="kpi"><b>${G.hearts}</b><span>Leben übrig</span></div>
    </div>
    ${passed?'':'<p>Alle Leben sind weg. Lies die Erklärungen unten und versuche es noch einmal – die Fragen werden neu gemischt.</p>'}
    ${uniq.length?`<h3>Das solltest du wiederholen</h3><ol class="review">${uniq.map(q=>`<li><div class="q">${esc(q.q||('Sicherheitsrat: '+q.topic))}</div><div class="a">${esc(q.e||'')}</div></li>`).join('')}</ol><p class="hint">Diese Fragen liegen jetzt in deiner Fehlerkartei.</p>`:''}
    <div class="actions"><button class="btn" id="again">Noch einmal</button><button class="btn ghost" id="back">Zu den Akten</button></div>
  </section></main>`;
  $('#again').onclick=()=>start(G.key); $('#back').onclick=home;
  window.scrollTo(0,0);
}

document.addEventListener('keydown',e=>{
  if(!G||!document.body.classList.contains('inquiz'))return;
  if(e.target.tagName==='INPUT')return;
  if(e.key==='Enter'){const n=$('#nxt')||(($('#chk')&&!$('#chk').disabled)?$('#chk'):null); if(n){e.preventDefault();n.click()}}
  else if(/^[1-9]$/.test(e.key)&&G.keys&&!G.answered){const b=G.keys[+e.key-1]; if(b)b.click()}
});
home();
</script>
